services:

  cpp-server:
    build: .
    image: cpp_server_image
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    command: "5555"

  web-server:
    build:
      context: ./web-server
    image: web_server_image
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - CPP_SERVER_HOST=cpp-server
      - CPP_SERVER_PORT=5555
      - MONGO_URI=mongodb://mongodb:27017/wolt
    depends_on:
      - cpp-server
      - mongodb

  
  mongodb:
    image: mongo:7
    volumes: 
      - mongo-data:/data/db
    ports: 
      - "27018:27017"

volumes:
  mongo-data: