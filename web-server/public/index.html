<!--
  index.html - React App Entry Point

  The single HTML file that loads the entire React SPA.
  Express serves this file for all non-API routes (via the catch-all route in app.js).
-->

<!DOCTYPE html>
<html>
   <head>
      <!--link to Bootstrap file and link to main.css-->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
      <link rel="stylesheet" href="/styles/main.css">
   </head>
   <body>
      <!--here react enters the app-->
      <div id="root"></div>

      <!--import libaries-->
      <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/react-router-dom@5/umd/react-router-dom.min.js"></script>
      <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

      <!--import all components-->
      <script type="text/babel" src="/components/AppContext.jsx"></script>
      <script type="text/babel" src="/components/ProtectedRoute.jsx"></script>
      <script type="text/babel" src="/components/InputField.jsx"></script>
      <script type="text/babel" src="/components/ImagePicker.jsx"></script>
      <script type="text/babel" src="/components/Login.jsx"></script>
      <script type="text/babel" src="/components/Register.jsx"></script>
      <script type="text/babel" src="/components/RestaurantCard.jsx"></script>
      <script type="text/babel" src="/components/CategoryBar.jsx"></script>
      <script type="text/babel" src="/components/RestaurantForm.jsx"></script>
      <script type="text/babel" src="/components/ProductForm.jsx"></script>
      <script type="text/babel" src="/components/ProductCard.jsx"></script>
      <script type="text/babel" src="/components/ClickGame.jsx"></script>
      <script type="text/babel" src="/components/Cart.jsx"></script>
      <script type="text/babel" src="/components/RestaurantPage.jsx"></script>
      <script type="text/babel" src="/components/OrderCard.jsx"></script>
      <script type="text/babel" src="/components/OrdersPage.jsx"></script>
      <script type="text/babel" src="/components/ProductSearchResult.jsx"></script>
      <script type="text/babel" src="/components/SearchPage.jsx"></script>
      <script type="text/babel" src="/components/CategoryPage.jsx"></script>
      <script type="text/babel" src="/components/Home.jsx"></script>
      <script type="text/babel" src="/components/EditProfile.jsx"></script>
      <script type="text/babel" src="/components/Navbar.jsx"></script>
      <script type="text/babel" src="/components/NotFound.jsx"></script>
      <script type="text/babel" src="/components/App.jsx"></script>

      <!-- Mount the App component into the root div. App is the base shell that always stays rendered -
     React Router inside it decides which screen to display based on the current URL -->
      <script type="text/babel">
      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
      </script>

   </body>
</html>
